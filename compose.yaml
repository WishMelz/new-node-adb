name: adb-desk

services:
  adb-desk:
    image: wishmelz/adb-desk:latest
    init: true
    restart: unless-stopped
    network_mode: host
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=128
      DATA_DIR: /app/.data
      ADB_PATH: /usr/bin/adb
      HOME: /app/.data
    volumes:
      - type: bind
        source: '${DATA_DIR:-./.data}'
        target: /app/.data
    mem_limit: 256m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: '3'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:' + (process.env.DOCKER_PORT || '23120') + '/api/health').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    stop_grace_period: 20s
